name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.system }} release
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: Linux
            runner: ubuntu-latest
          - system: macOS
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_FLAGS=-Werror
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Verify tag version
        run: |
          expected="v$(./build/fs-lint --version | awk '{print $2}')"
          test "$GITHUB_REF_NAME" = "$expected"
      - name: Package
        id: package
        run: |
          platform=$(uname -s | tr '[:upper:]' '[:lower:]')
          architecture=$(uname -m)
          package="fs-lint-legibility-${GITHUB_REF_NAME}-${platform}-${architecture}"
          mkdir release
          cmake --install build --prefix "$PWD/release/$package"
          "$PWD/release/$package/bin/fs-lint" --version
          tar -C release -czf "release/$package.tar.gz" "$package"
          cd release
          cmake -E sha256sum "$package.tar.gz" > "$package.tar.gz.sha256"
          echo "name=$package" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            release/*.tar.gz
            release/*.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: release
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "$GITHUB_REF_NAME" release/*
          --verify-tag
          --generate-notes
          --title "fs-lint-legibility $GITHUB_REF_NAME"
