name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: read

jobs:
  source:
    name: Source release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Package source
        run: |
          version="${GITHUB_REF_NAME#v}"
          package="fs-lint-legibility_${version}_source"
          mkdir release
          git archive --format=tar.gz --prefix="$package/" -o "release/$package.tar.gz" "$GITHUB_SHA"
          cd release
          cmake -E sha256sum "$package.tar.gz" > "$package.tar.gz.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fs-lint-legibility-source
          path: |
            release/*.tar.gz
            release/*.sha256
          if-no-files-found: error

  build:
    name: ${{ matrix.system }} release
    permissions:
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: Linux
            runner: ubuntu-latest
          - system: macOS
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_FLAGS=-Werror
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Verify tag version
        run: |
          expected="v$(./build/fs-lint --version | awk '{print $2}')"
          test "$GITHUB_REF_NAME" = "$expected"
      - name: Package
        id: package
        run: |
          platform=$(uname -s | tr '[:upper:]' '[:lower:]')
          architecture=$(uname -m)
          package="fs-lint-legibility-${GITHUB_REF_NAME}-${platform}-${architecture}"
          mkdir release
          cmake --install build --prefix "$PWD/release/$package"
          "$PWD/release/$package/bin/fs-lint" --version
          tar -C release -czf "release/$package.tar.gz" "$package"
          cd release
          cmake -E sha256sum "$package.tar.gz" > "$package.tar.gz.sha256"
          echo "name=$package" >> "$GITHUB_OUTPUT"
      - name: Attest archive
        id: attest
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26
        with:
          subject-path: release/${{ steps.package.outputs.name }}.tar.gz
      - name: Prepare release attestation
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
        run: cp "$BUNDLE_PATH" "release/$PACKAGE_NAME.tar.gz.sigstore.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            release/*.tar.gz
            release/*.sha256
            release/*.sigstore.json
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs:
      - build
      - source
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: release
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "$GITHUB_REF_NAME" release/*
          --verify-tag
          --generate-notes
          --prerelease
          --title "fs-lint-legibility $GITHUB_REF_NAME"
