name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.system }} / ${{ matrix.compiler }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: Linux
            compiler: GCC
            runner: ubuntu-latest
            cc: gcc
          - system: Linux
            compiler: Clang
            runner: ubuntu-latest
            cc: clang
          - system: macOS
            compiler: Clang
            runner: macos-latest
            cc: clang
    runs-on: ${{ matrix.runner }}
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_FLAGS=-Werror
      - name: Build
        run: cmake --build build --parallel
      - name: Test binary, library, and install
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: Linux / ASan + UBSan
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
      CC: clang
      SANITIZER_C_FLAGS: >-
        -Werror
        -fsanitize=address,undefined
        -fno-omit-frame-pointer
      SANITIZER_LINKER_FLAGS: -fsanitize=address,undefined
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Configure
        run: >-
          cmake -S . -B build-sanitized
          -DCMAKE_BUILD_TYPE=Debug
          "-DCMAKE_C_FLAGS=${SANITIZER_C_FLAGS}"
          "-DCMAKE_EXE_LINKER_FLAGS=${SANITIZER_LINKER_FLAGS}"
      - name: Build
        run: cmake --build build-sanitized --parallel
      - name: Test
        run: >-
          ctest --test-dir build-sanitized --output-on-failure
          --exclude-regex '^e2e-install$'

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: >-
          clang-format --dry-run --Werror
          include/*.h src/*.c src/*.h tests/*.c
